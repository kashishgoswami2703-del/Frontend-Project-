
<!DOCTYPE html>
<html>
<head>
    <title>Color Theme Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="page">
    <div class="container">
        <h1>Change Color Theme</h1>
        <p>Select a theme for this webpage.</p>

        <button onclick="changeTheme('lightblue')">Blue</button>
        <button onclick="changeTheme('lightgreen')">Green</button>
        <button onclick="changeTheme('lightpink')">Pink</button>
        <button onclick="changeTheme('black')">Dark</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
